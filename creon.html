        /* ── Header ─────────────────────────────────────────────────── */

            align-items: center;
            gap: 16px;

            border-radius: 50%;
            background: rgba(245, 245, 245, 0.08);
            border: none;
            color: #f5f5f5;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
            text-decoration: none;
        }
        .project-back:hover { background: rgba(245, 245, 245, 0.15); }
        .project-header-title {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #b5b5b5;
        }
        .project-header-author {
            font-size: 13px;
            font-weight: 500;
            color: #666;
        }

        /* ── Content stream ─────────────────────────────────────────── */
        .project-stream {
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .project-module {
            width: 100%;
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }
        .project-module.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ── Images ─────────────────────────────────────────────────── */
        .project-module img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* ── Video wrapper ──────────────────────────────────────────── */
        .video-wrap {
            position: relative;
            width: 100%;
            background: #000;
            overflow: hidden;
        }
        .video-wrap iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ── Shimmer loading overlay (videos + images) ──────────────── */
        .video-wrap::after,
        .img-loading::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, #0a0a0a 0%, #151515 40%, #1c1c1c 50%, #151515 60%, #0a0a0a 100%);
            background-size: 200% 100%;
            animation: shimmer 1.6s ease-in-out infinite;
            z-index: 1;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        .video-wrap.loaded::after,
        .img-loading.loaded::after {
            opacity: 0;
        }

        .img-loading {
            position: relative;
            overflow: hidden;
            background: #0a0a0a;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ── Footer ─────────────────────────────────────────────────── */
        .project-footer {
            padding: 80px 40px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }
        .project-footer-title {
            font-size: clamp(24px, 3vw, 40px);
            font-weight: 500;
            color: #f5f5f5;
        }
        .project-footer-sub {
            font-size: 16px;
            color: #888;
            max-width: 500px;
            line-height: 1.6;
        }
        .project-footer-cta {

            gap: 8px;
            padding: 14px 32px;
            background: #f5f5f5;
            color: #171717;
            border-radius: 999px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .project-footer-cta:hover { transform: scale(1.04); background: #fff; }

        @media (max-width: 768px) {
            .project-header { padding: 16px 20px; }
            .project-footer { padding: 60px 24px; }
}

    <script>
        /* ── Scroll reveal ────────────────────────────────────────── */
        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    revealObserver.unobserve(entry.target);
                }
            });
        }, { threshold: 0.05 });

        document.querySelectorAll('.project-module').forEach(mod => revealObserver.observe(mod));

        /* ── Image shimmer: detect load, remove shimmer ───────────── */
        document.querySelectorAll('.img-loading img').forEach(img => {
            if (img.complete && img.naturalHeight > 0) {
                img.parentElement.classList.add('loaded');
            } else {
                img.addEventListener('load', () => {
                    img.parentElement.classList.add('loaded');
                });
            }
        });

        /* ── Lazy-load iframes: only when ~800px from viewport ────── */
        const iframeObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const iframe = entry.target.querySelector('iframe[data-src]');
                    if (iframe) {
                        iframe.src = iframe.dataset.src;
                        iframe.removeAttribute('data-src');
                        iframe.addEventListener('load', () => {
                            entry.target.classList.add('loaded');
                        });
                    }
                    iframeObserver.unobserve(entry.target);
                }
            });
        }, { rootMargin: '800px 0px' });

        document.querySelectorAll('.video-wrap').forEach(wrap => iframeObserver.observe(wrap));
    </script>
