<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANTA REI — Everything Flows — VR Game</title>
    <link rel="icon" href="/favicon.png" type="image/png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #000; color: #f5f5f5; overflow-x: hidden; }

        .project-header { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; padding: 20px 40px; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.06); }
        .project-header-left { display: flex; align-items: center; gap: 16px; }
        .project-back { width: 40px; height: 40px; border-radius: 50%; background: rgba(245,245,245,0.08); border: none; color: #f5f5f5; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s ease; text-decoration: none; }
        .project-back:hover { background: rgba(245,245,245,0.15); }
        .project-header-title { font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.2px; color: #b5b5b5; }
        .project-header-author { font-size: 13px; font-weight: 500; color: #666; }

        .project-stream { width: 100%; display: flex; flex-direction: column; }
        .project-module { width: 100%; opacity: 0; transform: translateY(24px); transition: opacity 0.6s ease-out, transform 0.6s ease-out; }
        .project-module.visible { opacity: 1; transform: translateY(0); }
        .project-module img { width: 100%; height: auto; display: block; }

        .img-loading { position: relative; overflow: hidden; background: #0a0a0a; }
        .img-loading::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, #0a0a0a 0%, #151515 40%, #1c1c1c 50%, #151515 60%, #0a0a0a 100%); background-size: 200% 100%; animation: shimmer 1.6s ease-in-out infinite; z-index: 1; transition: opacity 0.5s ease; pointer-events: none; }
        .img-loading.loaded::after { opacity: 0; }

        .video-wrap { position: relative; width: 100%; background: #000; overflow: hidden; }
        .video-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .video-wrap::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, #0a0a0a 0%, #151515 40%, #1c1c1c 50%, #151515 60%, #0a0a0a 100%); background-size: 200% 100%; animation: shimmer 1.6s ease-in-out infinite; z-index: 1; transition: opacity 0.5s ease; pointer-events: none; }
        .video-wrap.loaded::after { opacity: 0; }

        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        .project-footer { padding: 80px 40px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 24px; }
        .project-footer-title { font-size: clamp(24px, 3vw, 40px); font-weight: 500; color: #f5f5f5; }
        .project-footer-sub { font-size: 16px; color: #888; max-width: 500px; line-height: 1.6; }
        .project-footer-cta { display: inline-flex; align-items: center; gap: 8px; padding: 14px 32px; background: #f5f5f5; color: #171717; border-radius: 999px; font-size: 16px; font-weight: 600; text-decoration: none; transition: transform 0.2s ease, background 0.2s ease; }
        .project-footer-cta:hover { transform: scale(1.04); background: #fff; }

        @media (max-width: 768px) { .project-header { padding: 16px 20px; } .project-footer { padding: 60px 24px; } }
    </style>
</head>
<body>
    <header class="project-header">
        <div class="project-header-left">
            <a href="javascript:void(0)" onclick="history.back()" class="project-back" title="Back to portfolio">&larr;</a>
            <div>
                <div class="project-header-title">Manta Rei — VR Game</div>
                <div class="project-header-author">Martina Marino — 2024</div>
            </div>
        </div>
    </header>

    <main class="project-stream">
        <!-- 0: Image -->
        <div class="project-module"><div class="img-loading"><img src="https://mir-s3-cdn-cf.behance.net/project_modules/1400_webp/e6c921210649651.671559d1d3e89.png" alt="Manta Rei" loading="eager"></div></div>

        <!-- 1: Vimeo — 74.98% -->
        <div class="project-module">
            <div class="video-wrap" style="padding-bottom: 74.98%;">
                <iframe data-src="https://player.vimeo.com/video/1162944810?title=0&byline=0&portrait=0&badge=0&autopause=0&loop=1" allow="autoplay; fullscreen"></iframe>
            </div>
        </div>

        <!-- 2: Image -->
        <div class="project-module"><div class="img-loading"><img src="https://mir-s3-cdn-cf.behance.net/project_modules/1400_webp/2c24f8210649651.671556b4f0bea.png" alt="Manta Rei" loading="lazy"></div></div>

        <!-- 3-8: GIFs + Images -->
        <div class="project-module"><div class="img-loading"><img src="https://mir-s3-cdn-cf.behance.net/project_modules/1400/17961d210649651.671556b4f203b.gif" alt="Manta Rei" loading="lazy"></div></div>
        <div class="project-module"><div class="img-loading"><img src="https://mir-s3-cdn-cf.behance.net/project_modules/1400/19716e210649651.671556b4f2548.gif" alt="Manta Rei" loading="lazy"></div></div>
        <div class="project-module"><div class="img-loading"><img src="https://mir-s3-cdn-cf.behance.net/project_modules/1400/078b22210649651.671556b4f1916.gif" alt="Manta Rei" loading="lazy"></div></div>
        <div class="project-module"><div class="img-loading"><img src="https://mir-s3-cdn-cf.behance.net/project_modules/1400/b3a816210649651.671556b4f1358.gif" alt="Manta Rei" loading="lazy"></div></div>
        <div class="project-module"><div class="img-loading"><img src="https://mir-s3-cdn-cf.behance.net/project_modules/1400/50f752210649651.671556b4f0673.gif" alt="Manta Rei" loading="lazy"></div></div>
        <div class="project-module"><div class="img-loading"><img src="https://mir-s3-cdn-cf.behance.net/project_modules/1400/b0b143210649651.671556b4f0115.gif" alt="Manta Rei" loading="lazy"></div></div>
    </main>

    <footer class="project-footer">
        <h2 class="project-footer-title">Interested in working together?</h2>
        <p class="project-footer-sub">This project was designed and art-directed by Martina Marino. Get in touch to discuss your next project.</p>
        <a href="mailto:martinamarinodesign@gmail.com" class="project-footer-cta">Get in touch &rarr;</a>
    </footer>

    <script>
        const revealObserver = new IntersectionObserver((entries) => { entries.forEach(entry => { if (entry.isIntersecting) { entry.target.classList.add('visible'); revealObserver.unobserve(entry.target); } }); }, { threshold: 0.05 });
        document.querySelectorAll('.project-module').forEach(mod => revealObserver.observe(mod));
        document.querySelectorAll('.img-loading img').forEach(img => { if (img.complete && img.naturalHeight > 0) { img.parentElement.classList.add('loaded'); } else { img.addEventListener('load', () => { img.parentElement.classList.add('loaded'); }); } });
        const iframeObserver = new IntersectionObserver((entries) => { entries.forEach(entry => { if (entry.isIntersecting) { const iframe = entry.target.querySelector('iframe[data-src]'); if (iframe) { iframe.src = iframe.dataset.src; iframe.removeAttribute('data-src'); iframe.addEventListener('load', () => { entry.target.classList.add('loaded'); }); } iframeObserver.unobserve(entry.target); } }); }, { rootMargin: '800px 0px' });
        document.querySelectorAll('.video-wrap').forEach(wrap => iframeObserver.observe(wrap));
    </script>
</body>
</html>
